name: One-time repository formatting repair

on:
  push:
    branches:
      - integration/git-merge-policy-v7.5.6.0

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout integration branch
        uses: actions/checkout@v4
        with:
          ref: integration/git-merge-policy-v7.5.6.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Apply the repository's declared formatter
        run: bun run format

      - name: Commit formatting-only changes
        run: |
          if git diff --quiet; then
            echo "No formatting changes are required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "style: apply repository Prettier formatting"
          git push origin HEAD:integration/git-merge-policy-v7.5.6.0
